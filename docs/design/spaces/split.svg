  <path class="icon" d="M957 155 h-5 v5 M966 155 h5 v5 M952 165 v5 h5 M971 165 v5 h-5"/>
  <text class="heading muted" x="1018" y="170">⋯</text>
  <rect class="warning-bg" x="249" y="180" width="806" height="36"/>
  <text class="small amber strong" x="268" y="202">Waiting for input · agent reported</text>
  <text class="small amber" x="1034" y="202" text-anchor="end">Answer in the terminal</text>
  <text class="mono green" x="272" y="252">alex ~/projects/api</text>
  <text class="mono" x="272" y="278">$ claude</text>
