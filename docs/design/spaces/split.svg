  <text class="mono-small muted" x="1088" y="862">The other terminal keeps running while you answer the review.</text>
  <path class="rule" d="M1064 916 H1872"/>
  <circle class="green" cx="1086" cy="931" r="3"/>
  <text class="small muted" x="1096" y="935">Connected</text>
  <text class="small muted" x="1850" y="935" text-anchor="end">Working · agent reported</text>
  <rect class="rule" width="1872" height="944"/>
</g>
<text class="note-title" x="24" y="1044">Attention is not focus.</text>
<text class="note" x="24" y="1068">Amber remains until the agent reports that waiting has ended.</text>
<text class="note" x="24" y="1090">Reading clears unread, not the pending question. No automatic approval.</text>
<text class="note-title" x="698" y="1044">Arrange views, never recreate processes.</text>
<text class="note" x="698" y="1068">Split, move, resize, maximize and restore keep session IDs.</text>
<text class="note" x="698" y="1090">Different projects can share the canvas; account bindings never move.</text>
<text class="note-title" x="1360" y="1044">Readable at actual terminal size.</text>
<text class="note" x="1360" y="1068">Wide panes here leave room for about 90 columns at 14px.</text>
<text class="note" x="1360" y="1090">Smaller canvases use one pane without losing the saved layout.</text>
<text class="note small" x="24" y="1134">Design specification only. Agent signals, multiple native sessions and the Spaces page still need implementation and real-browser/native validation.</text>
</svg>
