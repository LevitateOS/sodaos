  <rect class="surface" x="266" y="64" width="296" height="32" rx="5"/>
  <circle class="icon" cx="282" cy="79" r="5"/>
  <path class="icon" d="M286 83 l4 4"/>
  <text class="muted" x="302" y="85">Find a project or session…</text>
  <text class="amber" x="1570" y="85">Next attention ↓</text>
  <rect class="action" x="1716" y="64" width="140" height="32" rx="5"/>
  <text class="on-action strong" x="1731" y="85">+ New terminal</text>
  <path class="rule" d="M0 104 H1872"/>
  <rect class="surface" y="104" width="248" height="840"/>
  <path class="rule" d="M248 104 V944"/>
  <rect class="selected" x="12" y="119" width="55" height="28" rx="5"/>
  <text class="strong blue" x="32" y="138">All</text>
  <text class="muted" x="82" y="138">Attention</text>
  <rect class="warning-bg" x="149" y="122" width="22" height="21" rx="8"/>
  <text class="amber small strong" x="157" y="137">1</text>
  <text class="strong" x="17" y="184">⌄  acme/api</text>
  <text class="small muted" x="39" y="203">Environment running</text>
  <text class="muted heading" x="220" y="185">⋯</text>
  <text x="36" y="241">Auth refactor</text>
  <rect class="selected" x="8" y="265" width="232" height="48" rx="5"/>
  <rect class="action" x="8" y="273" width="3" height="32" rx="1"/>
  <text class="strong blue" x="36" y="286">Review auth</text>
  <text class="small amber" x="36" y="304">Waiting for input · reported</text>
  <circle class="ring" cx="222" cy="283" r="7"/>
  <text class="amber small strong" x="220" y="287">!</text>
  <text x="36" y="337">Test watcher</text>
  <text class="small muted" x="36" y="355">New output</text>
  <circle class="blue" cx="222" cy="334" r="3"/>
  <text class="strong" x="17" y="404">⌄  acme/web</text>
  <text class="small muted" x="39" y="423">Environment running</text>
  <text class="muted heading" x="220" y="405">⋯</text>
  <text x="36" y="456">Checkout flow</text>
  <text class="small muted" x="36" y="474">Working · visible in right pane</text>
  <text x="36" y="508">Dev server</text>
  <text x="36" y="558">Release notes</text>
  <text class="small muted" x="36" y="576">Kept · 24m remaining</text>
  <path class="rule" d="M16 609 H232"/>
  <text class="strong muted" x="17" y="641">›  acme/docs</text>
  <text class="small muted" x="39" y="660">Stopped · no sessions</text>
  <text class="small muted" x="16" y="903">Your sessions · this sign-in</text>
