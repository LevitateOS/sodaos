  <circle class="green" cx="270" cy="931" r="3"/>
  <text class="small muted" x="280" y="935">Connected</text>
  <text class="small muted" x="1034" y="935" text-anchor="end">Review auth · focused terminal</text>
  <rect class="focus" x="249" y="145" width="806" height="798"/>
  <!-- An eight-pixel divider has a larger pointer hit area in the real design. -->
  <rect class="panel" x="1056" y="104" width="8" height="840"/>
  <path class="rule" d="M1060 498 V546"/>
  <!-- Right pane: independent project binding. -->
  <rect class="surface" x="1064" y="104" width="808" height="40"/>
  <rect class="panel" x="1065" y="105" width="238" height="39"/>
  <text class="strong" x="1082" y="129">web / Checkout flow</text>
  <text class="muted" x="1279" y="129">×</text>
  <text class="muted" x="1322" y="129">web / Dev server</text>
  <text class="muted" x="1499" y="129">×</text>
  <path class="rule" d="M1305 104 V144 M1526 104 V144"/>
  <text class="heading muted" x="1836" y="130">+</text>
  <text class="small muted" x="1084" y="168">alex @</text>
  <text class="small strong" x="1129" y="168">acme/web</text>
  <text class="small muted" x="1593" y="168">Split right</text>
  <text class="small muted" x="1676" y="168">Below</text>
  <path class="icon" d="M1773 155 h-5 v5 M1782 155 h5 v5 M1768 165 v5 h5 M1787 165 v5 h-5"/>
  <text class="heading muted" x="1834" y="170">⋯</text>
  <path class="rule" d="M1064 179 H1872"/>
  <text class="mono green" x="1088" y="220">alex ~/projects/web</text>
  <text class="mono" x="1088" y="246">$ codex</text>
  <text class="mono strong" x="1088" y="292">Codex</text>
  <text class="mono muted" x="1088" y="316">~/projects/web</text>
  <text class="mono" x="1088" y="366">&gt; Improve validation in the checkout flow.</text>
  <text class="mono" x="1088" y="390">  Preserve the current field labels and keyboard behavior.</text>
  <text class="mono muted" x="1088" y="440">Inspecting src/checkout/form.ts</text>
  <text class="mono muted" x="1088" y="464">Inspecting tests/checkout.test.ts</text>
  <text class="mono" x="1088" y="516">I will keep errors next to their fields and preserve input</text>
  <text class="mono" x="1088" y="540">when validation fails.</text>
  <text class="mono muted" x="1088" y="590">Updating validation cases…</text>
  <path class="rule" d="M1088 794 H1848"/>
