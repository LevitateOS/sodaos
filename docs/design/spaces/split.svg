<?xml version="1.0" encoding="UTF-8"?>
<?xml-stylesheet type="text/css" href="/sheets.css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1160" viewBox="0 0 1920 1160" role="img" aria-labelledby="title description">
<title id="title">Spaces design — two projects side by side</title>
<desc id="description">Static wide desktop design. Review auth in acme/api is waiting for input, while Checkout flow in acme/web is visible in another pane. Tabs, direct split controls and a draggable divider keep the native terminals primary. All content is fictional.</desc>
<rect class="paper" width="1920" height="1160"/>
<text class="label" x="24" y="28">SPACES / 02 — COMPARE AND ATTEND</text>
<text class="small muted" x="24" y="48">Wide desktop · two projects, two readable terminals, six discoverable sessions</text>
<text class="label amber" x="1896" y="32" text-anchor="end">STATIC DESIGN · FICTIONAL DATA</text>
<g transform="translate(24 64)">
  <rect class="canvas" width="1872" height="944"/>
  <rect class="nav" width="1872" height="56"/>
  <image href="/symbol.svg" x="16" y="14" width="28" height="28"/>
  <text class="brand" x="53" y="37">soda</text>
  <text class="muted" x="128" y="34">Issues</text>
