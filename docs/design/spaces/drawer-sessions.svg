<title id="title">Spaces drawer design — session switching without blocking the forge</title>
<desc id="description">Static light-theme design. Native code browsing remains visible on the left. The right drawer temporarily shows its searchable project/session list, while keeping terminal tabs and a back control. Fictional content, not installed evidence.</desc>
