<text class="note-title" x="24" y="946">No extra sidebar inside the half-width drawer.</text>
<text class="note" x="24" y="970">Sessions temporarily uses the right content. Tabs stay reachable; the forge stays interactive.</text>
<text class="note-title" x="875" y="946">This-page filtering is explicit.</text>
<text class="note" x="875" y="970">It filters choices, never retargets an existing shell.</text>
<text class="note small" x="24" y="1010">Static schematic only. Native file rendering, session switching, authentication, signal reporting and view/process continuity require implementation and validation.</text>
