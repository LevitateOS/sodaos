  <path class="rule" d="M248 816 H1392"/>
  <circle class="green" cx="270" cy="831" r="3"/>
  <text class="small muted" x="280" y="835">Connected</text>
  <text class="small muted" x="1371" y="835" text-anchor="end">Auth refactor · focused terminal</text>
  <rect class="rule" width="1392" height="844"/>
</g>
<text class="note-title" x="24" y="946">Find work on the left. Work in the terminal.</text>
<text class="note" x="24" y="970">Project groups stay stable. Attention does not reorder rows, interrupt typing or answer an agent.</text>
<text class="note-title" x="860" y="946">Split only when it helps.</text>
<text class="note" x="860" y="970">No grid presets. Tabs are views of lasting sessions.</text>
<text class="note small" x="24" y="1002">Agent activity shown here requires explicit reporting; it is not inferred from terminal output. Application and multi-session backend are not implemented.</text>
</svg>
