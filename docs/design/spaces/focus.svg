<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title description">
<title id="title">Spaces design — default focused terminal</title>
<desc id="description">Static design with fictional sessions. A searchable project sidebar, attention filter, local terminal tabs and direct split actions surround one large native terminal. This is not an installed product screenshot.</desc>
<rect class="paper" width="1440" height="1024"/>
<text class="label" x="24" y="28">SPACES / 01 — FOCUS</text>
<text class="small muted" x="24" y="48">Default desktop · one readable terminal, every session within reach</text>
<text class="label amber" x="1416" y="32" text-anchor="end">STATIC DESIGN · FICTIONAL DATA</text>
<g transform="translate(24 64)">
