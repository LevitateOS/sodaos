[package]
name = "soda-project-account"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Bounded project account setup (PR42 Rust port of the project-os project-account helper)"

[[bin]]
name = "project-account"
path = "src/main.rs"

[dependencies]
soda-json = { path = "../soda-json" }
libc = "0.2"
# Exact port of the key validation regex: Python str \w (isalnum-or-underscore)
# and \s (White_Space plus FS/GS/RS/US) need real Unicode property tables.
regex = "1"
