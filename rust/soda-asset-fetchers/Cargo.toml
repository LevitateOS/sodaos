[package]
name = "soda-asset-fetchers"
version = "0.1.0"
edition = "2021"

[lib]
name = "soda_asset_fetchers"
path = "src/lib.rs"

[[bin]]
name = "soda-fetch-tea"
path = "src/bin/soda-fetch-tea.rs"

[[bin]]
name = "soda-fetch-terminal"
path = "src/bin/soda-fetch-terminal.rs"

[[bin]]
name = "soda-fetch-muse"
path = "src/bin/soda-fetch-muse.rs"

[dependencies]
soda-json = { path = "../soda-json" }
soda-build-tools = { path = "../soda-build-tools" }
ureq = { version = "2", default-features = false, features = ["tls"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
base64 = "0.22"
