# SodaOS Rust workspace. Builds are online: `cargo build --workspace`.
# Dependencies resolve from the network; Cargo.lock stays committed for
# reproducibility. Never vendor dependencies.
[workspace]
resolver = "2"
members = ["tools/release-assets", "rust/soda-build-tools", "rust/soda-factory", "cmd/soda-setup", "lib/host", "rust/soda-identity-compose", "rust/soda-pg-fixture", "rust/soda-forgejo-migrate", "cmd/soda-pg-maintenance", "rust/soda-console-welcome", "lib/json", "cmd/soda-activate", "rust/soda-forgejo-domain", "rust/soda-candidate-setup", "rust/soda-image-import", "rust/soda-rotate-lab-creds", "rust/soda-muse", "rust/soda-test-vm", "rust/soda-muse-maintain", "cmd/soda-identity", "rust/soda-acceptance", "rust/soda-install", "cmd/soda-project-terminal", "lib/soda-release-build", "lib/soda-release-image", "lib/soda-release-tools", "lib/soda-release-deliver", "rust/soda-project-factory-roles"]
