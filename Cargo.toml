# SodaOS Rust workspace. Builds are online: `cargo build --workspace`.
# Dependencies resolve from the network; Cargo.lock stays committed for
# reproducibility. Never vendor dependencies.
[workspace]
resolver = "2"
members = ["tools/release-assets", "lib/release-inputs", "cmd/soda-factory", "cmd/soda-setup", "lib/host", "cmd/soda-identity-compose", "tools/pg-fixture", "cmd/soda-forgejo-migrate", "cmd/soda-pg-maintenance", "cmd/soda-console-welcome", "cmd/soda-activate", "cmd/soda-forgejo-domain", "tools/candidate-setup", "cmd/soda-image-import", "tools/lab-credentials", "cmd/soda-muse", "tools/test-vm", "cmd/soda-muse-maintain", "cmd/soda-identity", "tools/acceptance", "cmd/soda-install", "cmd/soda-project-terminal", "lib/soda-release-build", "lib/soda-release-image", "lib/soda-release-tools", "lib/soda-release-deliver"]
