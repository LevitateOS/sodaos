[package]
name = "soda-project-terminal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Fixed project-local terminal agent (PR25 Rust port of project_terminal.py, identity_terminal.py, project_keys.py)"

[[bin]]
name = "project-terminal"
path = "src/main.rs"

[[bin]]
name = "project-account"
path = "src/bin/project-account.rs"

[[bin]]
name = "project-factory-roles"
path = "src/bin/project-factory-roles.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
libc = "0.2"
soda-wire-time = { path = "../../lib/wire-time" }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "net", "event"] }
