[package]
name = "soda-install"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "soda-install"
path = "src/main.rs"

[dependencies]
tempfile = "=3.27.0"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
base64 = "=0.22.1"
getrandom = { version = "=0.4.3", features = ["std"] }
libc = "=0.2.190"
sha2 = { version = "0.10", features = ["oid"] }
elliptic-curve = "0.13"
p224 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
p384 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
p521 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdsa", "std"] }
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit"] }
ecdsa = { version = "=0.16.9", default-features = false, features = ["verifying", "pkcs8", "std"] }
signature = "2"
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "fast", "zeroize"] }
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ecdsa"] }
x509-cert = { version = "=0.2.5", default-features = false, features = ["std", "pem"] }
url = "=2.5.8"

[dev-dependencies]
soda-release-image = { path = "../../lib/soda-release-image" }
