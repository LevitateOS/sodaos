[package]
name = "soda-setup"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "soda-setup"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
getrandom = { version = "=0.4.3", features = ["std"] }
url = "=2.5.8"
ureq = { version = "=2.12.1", default-features = false, features = ["tls"] }
