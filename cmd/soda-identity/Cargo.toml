[package]
name = "soda-identity"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Soda subscription identity broker (lane B)"

[[bin]]
name = "soda-identity"
path = "src/main.rs"

[lib]
name = "soda_identity"
path = "src/lib.rs"

[dependencies]
base64 = "=0.22.1"
sha2 = "=0.10.9"
getrandom = { version = "=0.4.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
aes-gcm = "0.11.1"
soda-unix-http = { path = "../../lib/unix-http" }
tokio-postgres = { version = "=0.7.18", features = ["with-serde_json-1"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.3"
bytes = "=1.12.1"
percent-encoding = "=2.3.2"
soda-wire-time = { path = "../../lib/wire-time" }
