[package]
name = "soda-identity"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Soda subscription identity broker (lane B)"

[[bin]]
name = "soda-identity"
path = "src/main.rs"

[lib]
name = "soda_identity"
path = "src/lib.rs"

[dependencies]
identity-providers = { path = "../../rust/identity-providers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
postgres-protocol = "0.6.12"
aes-gcm = "0.11.1"
bytes = "1.12.1"
fallible-iterator = "0.2.0"
