[package]
name = "soda-muse"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "soda-muse"
path = "src/main.rs"

[dependencies]
walkdir = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
libc = "0.2"

[dev-dependencies]
tempfile = "=3.27.0"
