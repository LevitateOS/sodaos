PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
UsePAM yes
AuthorizedKeysFile /etc/ssh/authorized_keys/%u
AllowGroups soda-project
# Also applies to ordinary non-interactive ssh user@ip command execution.
SetEnv MISE_DATA_DIR=/opt/mise MISE_GLOBAL_CONFIG_FILE=/etc/mise/config.toml MISE_GLOBAL_CONFIG_ROOT=/etc/mise
SetEnv PATH=/opt/mise/shims:/usr/local/bin:/usr/bin:/bin
SetEnv CONTAINER_HOST=unix:///run/soda-podman/podman.sock PODMAN_COMPOSE_PROVIDER=/usr/local/bin/podman-compose
