services:
  database:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_DB: soda_example
      POSTGRES_USER: developer
      POSTGRES_PASSWORD_FILE: /run/secrets/soda-example-db
    secrets:
      - source: soda-example-db
        uid: "999"
        gid: "999"
        mode: "0400"
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
  files:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./public:/srv:ro
volumes:
  database:
secrets:
  soda-example-db:
    external: true
