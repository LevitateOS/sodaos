[package]
name = "soda-release-build"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Rust port of internal/release/build (OCI/CoreOS/production build pipeline)"

[lib]
name = "soda_release_build"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
soda-build-tools = { path = "../release-inputs" }
libc = "0.2"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }
