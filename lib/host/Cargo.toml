[package]
name = "soda-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "soda_host"
path = "src/lib.rs"

[[bin]]
name = "soda-host"
path = "src/main.rs"

[[bin]]
name = "soda-forgejo-tailnet"
path = "../../cmd/soda-forgejo-tailnet/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
base64 = "=0.22.1"
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic"] }
p384 = { version = "=0.13.1", default-features = false, features = ["arithmetic"] }
p521 = { version = "=0.13.3", default-features = false, features = ["arithmetic"] }
sha2 = "=0.10.9"
getrandom = { version = "=0.4.3", features = ["std"] }
libc = "0.2"
soda-release-deliver = { path = "../../lib/soda-release-deliver" }
soda-release-build = { path = "../../lib/soda-release-build" }
soda-unix-http = { path = "../unix-http" }
