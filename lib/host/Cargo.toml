[package]
name = "soda-host"
version = "0.1.0"
edition = "2021"

[lib]
name = "soda_host"
path = "src/lib.rs"

[[bin]]
name = "soda-host"
path = "src/main.rs"

[[bin]]
name = "soda-forgejo-tailnet"
path = "../../cmd/soda-forgejo-tailnet/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
base64 = "=0.22.1"
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic"] }
p384 = { version = "=0.13.1", default-features = false, features = ["arithmetic"] }
p521 = { version = "=0.13.3", default-features = false, features = ["arithmetic"] }
sha2 = "=0.10.9"
getrandom = { version = "=0.4.3", features = ["std"] }
libc = "0.2"
soda-release-deliver = { path = "../../lib/soda-release-deliver" }
soda-release-build = { path = "../../lib/soda-release-build" }
soda-unix-http = { path = "../unix-http" }
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
http-body-util = "=0.1.3"
bytes = "=1.12.1"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ecdsa"] }
url = "=2.5.8"
percent-encoding = "=2.3.2"
soda-wire-time = { path = "../wire-time" }
