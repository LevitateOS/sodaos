[package]
name = "soda-unix-http"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Bounded HTTP/1 transport for existing private Unix clients"

[dependencies]
bytes = "=1.12.1"
http-body-util = "=0.1.3"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "client"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
tokio = { version = "=1.53.2", default-features = false, features = ["rt", "net", "time"] }
