[package]
name = "soda-release-tools"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Rust ports of the soda-build, soda-candidate, and soda-artifacts release CLIs"

[lib]
name = "soda_release_tools"
path = "src/lib.rs"

[[bin]]
name = "soda-build"
path = "src/bin/soda-build.rs"

[[bin]]
name = "soda-candidate"
path = "src/bin/soda-candidate.rs"

[[bin]]
name = "soda-artifacts"
path = "src/bin/soda-artifacts.rs"

[[bin]]
name = "soda-candidate-check"
path = "src/bin/soda-candidate-check.rs"

[[test]]
name = "cli"
path = "tests/cli/main.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
getrandom = { version = "=0.4.3", features = ["std"] }
soda-json = { path = "../json" }
soda-release-build = { path = "../soda-release-build" }
soda-release-deliver = { path = "../soda-release-deliver" }
soda-release-image = { path = "../soda-release-image" }
libc = "=0.2.190"
sha2 = "0.10"
