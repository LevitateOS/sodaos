[package]
name = "soda-release-deliver"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Rust port of internal/release/deliver (release/channel admission, prepare, sign, publish)"

[lib]
name = "soda_release_deliver"
path = "src/lib.rs"

[dependencies]
soda-json = { path = "../json" }
soda-build-tools = { path = "../../rust/soda-build-tools" }
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
libc = "=0.2.190"

[dev-dependencies]
soda-json = { path = "../json" }
