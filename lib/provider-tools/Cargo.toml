[package]
name = "soda-provider-tools"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "Shared provider CLI freshness store: discovery, admission, selection, refs (UP-20261026-v1)"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
ureq = { version = "=2.12.1", default-features = false, features = ["tls", "native-certs"] }
tar = "0.4"
flate2 = "1"
tempfile = "=3.27.0"
libc = "=0.2.190"
