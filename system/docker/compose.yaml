name: sodaos
services:
  soda:
    image: ${SODA_IMAGE:?Set SODA_IMAGE to the selected Docker runtime image}
    platform: linux/amd64
    privileged: true
    userns_mode: host
    cgroup: private
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 5m
    environment:
      SODA_PROJECT_SUBNET: ${SODA_PROJECT_SUBNET:-10.89.0.0/24}
    tmpfs:
      - /run
      - /tmp
    volumes:
      - config:/etc
      - state:/var
      - home:/home
volumes:
  config:
  state:
  home:
