[package]
name = "soda-pg-fixture"
version = "0.1.0"
edition = "2021"
default-run = "soda-pg-fixture"

[[bin]]
name = "soda-pg-fixture"
path = "src/main.rs"

[[bin]]
name = "soda-native-pg-check"
path = "src/bin/soda-native-pg-check.rs"

[dependencies]
soda-desktop-runtime = { workspace = true }
libc = "=0.2.191"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs"] }
tempfile = "=3.27.0"
getrandom = { version = "=0.4.3", features = ["std"] }
soda-unix-http = { workspace = true }
