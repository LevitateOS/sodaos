[package]
name = "soda-candidate-setup"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "soda-candidate-setup"
path = "src/main.rs"

[dependencies]
libc = "=0.2.190"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
getrandom = { version = "=0.4.3", features = ["std"] }
