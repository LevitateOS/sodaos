[package]
name = "soda-source-complexity"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone source analyzer; never builds the product workspace.
[workspace]

[dependencies]
syn = { version = "=2.0.119", features = ["full", "visit"] }
quote = "=1.0.47"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
