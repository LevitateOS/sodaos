name: CI

on:
  push:
    branches: [main]
    tags: ['ci/soda-main-*']
  pull_request:
  workflow_dispatch:
  merge_group:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -mod=readonly
  CGO_ENABLED: '0'
  CARGO_TERM_COLOR: always

jobs:
  reuse:
    name: Exact commit CI admission
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      reused: ${{ steps.check.outputs.reused }}
      started_at: ${{ steps.check.outputs.started_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-reuse.sh

  go:
    needs: [reuse]
    if: ${{ needs.reuse.outputs.reused != 'true' }}
    name: Go push checks (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        profile: [core, store, web]
    defaults:
      run:
        working-directory: sodaos
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_PASSWORD: soda-ci-fixture
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sodaos
          persist-credentials: false
      - name: Read Fountain source pin and create short temporary directory
        id: fountain
        run: |
          jq -e 'keys == ["repository", "revision"] and (.repository | test("^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")) and (.revision | test("^[0-9a-f]{40}$"))' fountain-source.json >/dev/null
          jq -r '"repository=\(.repository)\nrevision=\(.revision)"' fountain-source.json >> "$GITHUB_OUTPUT"
          echo "TMPDIR=$(mktemp -d "$HOME/t.XXXXXX")" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.fountain.outputs.repository }}
          ref: ${{ steps.fountain.outputs.revision }}
          path: forgejo-ext
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sodaos/go.mod
          cache-dependency-path: sodaos/go.sum
      - name: Run push tests with mandatory PostgreSQL fixture
        env:
          PROFILE: ${{ matrix.profile }}
          SODA_PG_HOST: 127.0.0.1
          SODA_PG_PORT: '5432'
        run: |
          umask 077
          export SODA_PG_SUPER_PASSWORD_FILE="$TMPDIR/postgres.passwd"
          printf '%s' 'soda-ci-fixture' > "$SODA_PG_SUPER_PASSWORD_FILE"
          bash scripts/check-push.sh "$PROFILE"

  browser:
    needs: [reuse]
    if: ${{ needs.reuse.outputs.reused != 'true' }}
    name: TypeScript and browser source contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bash scripts/check-push.sh browser

  rust:
    needs: [reuse]
    if: ${{ needs.reuse.outputs.reused != 'true' }}
    name: Rust foundation contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --profile minimal --no-self-update
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: bash scripts/check-push.sh rust

  complexity:
    needs: [reuse]
    if: ${{ needs.reuse.outputs.reused != 'true' }}
    name: Production function complexity
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: rustup toolchain install --profile minimal --no-self-update
      - run: cargo fetch --locked --manifest-path tools/source-complexity/rust/Cargo.toml
      - name: Check source without building the product
        env:
          COMPLEXITY_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [[ -z "$COMPLEXITY_BASE" || "$COMPLEXITY_BASE" =~ ^0+$ ]]; then
            COMPLEXITY_BASE=$(git rev-parse HEAD^)
          fi
          bash scripts/check-complexity.sh --all --base "$COMPLEXITY_BASE"
          bun run test:complexity

  packaging:
    needs: [reuse]
    if: ${{ needs.reuse.outputs.reused != 'true' }}
    name: Docker packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install verified Dockerfile linter
        run: |
          mkdir -p .artifacts/docker-ci/tools
          curl --fail --silent --show-error --location \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
            --output .artifacts/docker-ci/tools/hadolint
          printf '%s\n' 'c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  .artifacts/docker-ci/tools/hadolint' | sha256sum --check
          chmod 0755 .artifacts/docker-ci/tools/hadolint
          echo "$PWD/.artifacts/docker-ci/tools" >> "$GITHUB_PATH"
      - run: bash scripts/check-docker-packaging.sh

  ci:
    name: CI
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    needs: [reuse, go, browser, rust, complexity, packaging]
    if: ${{ always() }}
    steps:
      - name: Require all push jobs within five minutes
        env:
          REUSE_RESULT: ${{ needs.reuse.result }}
          REUSED_CHECKS: ${{ needs.reuse.outputs.reused }}
          GATE_STARTED_AT: ${{ needs.reuse.outputs.started_at }}
          GO_RESULT: ${{ needs.go.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
          COMPLEXITY_RESULT: ${{ needs.complexity.result }}
        run: |
          set -euo pipefail
          test "$REUSE_RESULT" = success
          case "$REUSED_CHECKS" in
            false) expected=success ;;
            true) expected=skipped ;;
            *) exit 1 ;;
          esac
          [[ "$GATE_STARTED_AT" =~ ^[0-9]+$ ]]
          elapsed=$(( $(date +%s) - GATE_STARTED_AT ))
          (( elapsed >= 0 && elapsed < 300 )) || { echo "Push qualification expired after ${elapsed}s" >&2; exit 1; }
          test "$GO_RESULT" = "$expected"
          test "$BROWSER_RESULT" = "$expected"
          test "$RUST_RESULT" = "$expected"
          test "$PACKAGING_RESULT" = "$expected"
          test "$COMPLEXITY_RESULT" = "$expected"
