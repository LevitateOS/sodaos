<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!-- Coarse monochrome fibers; contrast is applied to the grain, never the label. -->
  <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency=".28 .52" numOctaves="3" seed="8" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="3" intercept="-1"/>
      <feFuncG type="linear" slope="3" intercept="-1"/>
      <feFuncB type="linear" slope="3" intercept="-1"/>
      <feFuncA type="table" tableValues=".8 .8"/>
    </feComponentTransfer>
  </filter>
  <path fill="#fff" filter="url(#paper)" d="M0 0h180v180H0z"/>
</svg>
